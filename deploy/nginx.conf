server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 需求文档上传（.md/.txt/.docx）走内存，给足余量
    client_max_body_size 20m;

    # Agent-Memory 面板挂到同源 /am/：面板登录态存在 localStorage，同源时才能
    # 用本人 user_key 免登。hub 地址由集成中心配置，api 按配置实时回源。
    location = /am { return 302 /am/; }
    location /am/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /api/v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # 与 hub 的 MEMORY_MAX_BODY_BYTES 对齐；知识入库可能跑很久
        client_max_body_size 32m;
        proxy_read_timeout 600s;
    }
    # 面板静态资源与 VEGA 自己的 /assets 同路径：先取本地，取不到再回源
    location /assets/ {
        try_files $uri @am;
    }
    location @am {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location = /logo.png {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE（对话流式输出）必须逐条下发，且连接不能按默认 60s 掐断
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /webhooks/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前端是 history 路由：未知路径一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
